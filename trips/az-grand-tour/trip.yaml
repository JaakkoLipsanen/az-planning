plan:
  days: { min: 18, max: 30, default: 20 }
  longDayHours: 7.5
  start: Phoenix, 44th St Sky Train station
  finish: Tucson, Time Market (finish)
  note: "Moving time = distance ÷ speed + climb ÷ climbing rate: singletrack 9.5–12 km/h (AZT slowest, Bug Spring Trail 5 km/h), dirt roads 13–15 km/h, pavement 20 km/h; climbing 450 / 550 / 700 m/h. Add breaks on top: December has ~10 h of daylight (Tucson sunrise ~7:15, sunset ~17:25), so days over 7.5 h moving are flagged."
  overnights:
    - { km: 98.8, lat: 33.97994, lon: -111.71646, name: "Horseshoe Campground (fee, water, Verde River)" }
    - { km: 185.0, lat: 34.30658, lon: -112.11161, name: "Cordes Junction (motel, 50s Diner, 24 h McDonald's)" }
    - { km: 279.3, lat: 34.19407, lon: -112.15867, name: "Bumble Bee: ranch camping (call ahead) or free dispersed camping by Bumble Bee Creek" }
