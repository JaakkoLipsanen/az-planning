basemap:
  majorPlaces: [Phoenix, Tucson]

land:
  corridorKm: 15
  note: "Rough (generalised) boundaries - good enough to tell National Forest from State Trust or private land when picking a camp; State Trust land needs the Arizona State Land Dept recreational permit, private land needs permission. Click the map with the overlay on to read the owner at a point."

imagery:
  basemaps: [usgs-topo, usgs-imagery, terrain, opentopomap, esri-imagery, mapbox]
  default: usgs-topo
  thumbnail: { lat: 32.445, lon: -110.76 }

# Tile packs the app can store for offline use. radiusKm: zoom -> buffer in km around the route and alternatives.
# Zoomed-out levels cover a wide area cheaply; detail levels stay close to the route (the map upscales lower zooms elsewhere).
offline:
  packs:
    - id: terrain
      label: Terrain shading and 3D
      source: terrain
      radiusKm: { 6: 200, 7: 200, 8: 200, 9: 150, 10: 100, 11: 50 }
    - id: topo
      label: USGS topo, overview (zoom 8-12)
      source: usgs-topo
      radiusKm: { 8: 200, 9: 150, 10: 100, 11: 75, 12: 50 }
    - id: topo-detail
      label: USGS topo, detail (zoom 13-15)
      source: usgs-topo
      radiusKm: { 13: 15, 14: 5, 15: 2 }
    - id: imagery
      label: Satellite, overview (zoom 8-12)
      source: usgs-imagery
      radiusKm: { 8: 200, 9: 150, 10: 100, 11: 75, 12: 50 }
    - id: imagery-detail
      label: Satellite, detail (zoom 13-15)
      source: usgs-imagery
      radiusKm: { 13: 10, 14: 4, 15: 1.5 }
    - id: imagery-sharpest
      label: Satellite, sharpest (zoom 16)
      source: usgs-imagery
      radiusKm: { 16: 0.5 }

# Shown on the day plan when a day reaches these places on matching dates (months 1-12, weekdays sun-sat, from/to dates).
notices:
  - text: "Arizona Canal bank (inside the Salt River Pima-Maricopa Indian Community): if it is gated or signed no-trespassing, take link 1a (Pima Rd / Chaparral Rd, +0.8 km)."
    sections: ["2"]
  - text: "Mt Lemmon Control Road is not maintained in winter: check the Coronado NF (Santa Catalina RD) road status; snow and ice are possible."
    sections: ["7"]
    months: [11, 12, 1, 2, 3]
  - text: "Summerhaven sits at 2,400 m: freezing nights and possible snow. Check the winter opening days of the General Store and the Cookie Cabin."
    sections: ["8"]
    months: [11, 12, 1, 2, 3]
  - text: "Sunset Trail #90 (the AZT300 line from Summerhaven, an alternative here) is closed Monday to Thursday until December 2026 (AZTR detour note)."
    at: { lat: 32.44481, lon: -110.7605 }
    weekdays: [mon, tue, wed, thu]
    to: 2026-12-31
  - text: "Bug Spring Trail's upper end (~1,850 m) can hold snow after a storm: stay on the Catalina Highway to Prison Camp if so."
    sections: [9b]
    months: [11, 12, 1, 2, 3]
  - text: "Parker Canyon Lake marina has limited winter hours (water and the store)."
    at: { lat: 31.41958, lon: -110.43872 }
    months: [11, 12, 1, 2, 3]

checklist:
  - text: "Arizona State Land Department recreational permit: the Fool's Loop and the Queen's Ransom cross State Trust land."
  - text: "Entry fees at Usery Mountain, Lost Dutchman and San Tan parks."
  - text: "Bookings: Lost Dutchman State Park campground, the Kentucky Camp cabin, Bumble Bee ranch camping (call ahead)."
  - text: "Mt Lemmon Control Road status (Coronado NF, Santa Catalina Ranger District) before committing to it."
  - text: "Springs, tanks and collectors on the Arizona Trail: check the water report."
    link: { label: AZT Water Report (FarOut), url: "https://app.faroutguides.com/guides/Arizona%20Trail%20Water%20Report" }

# Typical weather by week of the year from 20 years of daily data (sun times need `timezone` above).
climate:
  years: [2005, 2024]

gpx:
  baseName: AZ_FoolsLoop_QueensRansom_AZT_Lemmon_MRR
  name: "AZ Grand Tour: Fools Loop + Queen's Ransom + AZT + Mt Lemmon + Madrean Rugged Ramble"
  description: "Stitched bikepacking route: Fool's Loop (bikepacking.com) -> link 1b via the Arizona Canal -> Queen's Ransom (bikepacking.com) -> road to Kearny and back -> Arizona Trail (AZTR AZT300_SBXL_2026_v3) to Oracle -> Mt Lemmon Control Road (bikepacking.com Redington-Lemmon Loop) -> Catalina Highway down from Summerhaven -> Bug Spring Trail -> AZT (Molino, Bellota) -> Madrean Rugged Ramble through Saguaro NP and on the AZT to Kentucky Camp -> AZT to the SR-82 underpass with the AZTR Legacy Patagonia detour -> AZT / Madrean Rugged Ramble to Parker Canyon Lake -> Madrean Rugged Ramble via Lochiel and Patagonia to Tucson. {distanceKm} km, ~{climbM} m climbing. Source trackpoints are copied verbatim; connectors routed on OpenStreetMap."
